plugins {
	id 'base'
	id 'net.fabricmc.fabric-loom-remap' apply false
	id 'net.fabricmc.fabric-loom' apply false
}

def versionProfileName = providers.gradleProperty('minecraft_version_profile')
		.orElse(providers.gradleProperty('target_minecraft_version'))
		.orElse('1.21.11')
		.get()
def versionProfileFile = file("gradle/version-profiles/${versionProfileName}.properties")
if (!versionProfileFile.isFile()) {
	throw new GradleException("Unknown Minecraft version profile '${versionProfileName}'. Add ${versionProfileFile}.")
}
def versionProfile = new Properties()
versionProfileFile.withInputStream { versionProfile.load(it) }

[
		'minecraft_version',
		'loader_version',
		'loom_version',
		'fabric_api_version',
		'java_version'
].each { key ->
	if (!versionProfile.getProperty(key)) {
		throw new GradleException("Minecraft version profile '${versionProfileName}' is missing ${key}.")
	}
}

def profileProperty = { String key, String defaultValue ->
	def value = versionProfile.getProperty(key)
	return value != null && !value.isBlank() ? value.trim() : defaultValue
}
def selectedMinecraftVersion = versionProfile.getProperty('minecraft_version')

ext.minecraft_version_profile = versionProfileName
ext.minecraft_version_profile_id = profileProperty('profile_id', versionProfileName)
ext.minecraft_version = selectedMinecraftVersion
ext.loader_version = versionProfile.getProperty('loader_version')
ext.loom_version = versionProfile.getProperty('loom_version')
ext.fabric_api_version = versionProfile.getProperty('fabric_api_version')
ext.target_java_version = versionProfile.getProperty('java_version') as int
ext.minecraft_dependency = profileProperty('minecraft_dependency', "~${selectedMinecraftVersion}")
ext.compat_group = profileProperty('compat_group', minecraft_version_profile_id)
ext.modrinth_game_versions = profileProperty('modrinth_game_versions', selectedMinecraftVersion)
		.split(',')
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
ext.unobfuscated_minecraft = profileProperty('unobfuscated_minecraft', 'false').toBoolean()
ext.loom_plugin_id = unobfuscated_minecraft ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
ext.fabric_dependency_configuration = unobfuscated_minecraft ? 'implementation' : 'modImplementation'
ext.release_jar_task_name = unobfuscated_minecraft ? 'jar' : 'remapJar'
ext.coreProjectDependency = {
	if (rootProject.unobfuscated_minecraft) {
		return rootProject.dependencies.project(path: ':inventorysort-core', configuration: 'archives')
	}
	return rootProject.dependencies.project(path: ':inventorysort-core', configuration: 'namedElements')
}

allprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		// Loom adds essential repositories automatically
	}
}

def publicFeatureProjects = [
		project(':inventorysort'),
		project(':inventorysearch'),
		project(':inventorycatalogue')
]
def moduleAssetIncludes = [
		':inventorysort-core': ['inventory-sort/icon.png'],
		':inventorysort'     : ['inventory-sort/invsort.jpg'],
		':inventorysearch'   : ['inventory-sort/invsearch.jpg'],
		':inventorycatalogue': ['inventory-sort/invcatalogue.jpg']
]
def publicFeatureModrinthProjects = [
		[
				project          : project(':inventorysort'),
				displayName      : 'InvSort',
				projectIdProperty: 'modrinth_inventorysort_project_id'
		],
		[
				project          : project(':inventorysearch'),
				displayName      : 'InvSearch',
				projectIdProperty: 'modrinth_inventorysearch_project_id'
		],
		[
				project          : project(':inventorycatalogue'),
				displayName      : 'InvCatalogue',
				projectIdProperty: 'modrinth_inventorycatalogue_project_id'
		]
]
def releaseOutputDirectory = layout.buildDirectory.dir("release/${minecraft_version_profile_id}")
def profileListProperty = { String key, String defaultValue ->
	(findProperty(key) ?: defaultValue)
			.toString()
			.split(',')
			.collect { it.trim() }
			.findAll { !it.isEmpty() }
}
def supportedMinecraftVersionProfiles = profileListProperty('supported_minecraft_version_profiles', minecraft_version_profile)
def candidateMinecraftVersionProfiles = profileListProperty('candidate_minecraft_version_profiles', '')
def validationMinecraftVersionProfiles = (supportedMinecraftVersionProfiles + candidateMinecraftVersionProfiles).unique()
def smokeTestRequiredMinecraftVersionProfiles = profileListProperty(
		'smoke_test_required_minecraft_version_profiles',
		supportedMinecraftVersionProfiles.join(',')
)
def maxPublicReleaseJarSizeBytes = (findProperty('public_release_max_jar_size_bytes') ?: '199000').toString() as long
def forbiddenPackagedPathPattern = ~/(?i)(^|\/)(README|CHANGELOG|TODO|AGENTS|COMPATIBILITY)(\.|\/|$)|\.(md|adoc|txt|java|kt|kts|gradle|properties|ps1|bat|sh|xcf|psd|kra|blend|svg)$/
def allowedPackagedPathPattern = ~/(?i)(^|\/)LICENSE(-GPL-3\.0)?(_[^\/]+)?$/
def packagedJunkEntries = { Collection<String> entryNames ->
	entryNames.findAll { name ->
		!name.endsWith('/')
				&& (name =~ forbiddenPackagedPathPattern).find()
				&& !(name =~ allowedPackagedPathPattern).find()
	}.sort()
}
def excludedSharedClientSources = profileProperty('excluded_shared_client_sources', '')
		.split(',')
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
ext.excluded_shared_client_sources = excludedSharedClientSources
def gradleWrapperExecutable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
		? 'gradlew.bat'
		: './gradlew'
def useSmokeTestXvfb = (findProperty('inventorysort_smoke_xvfb') ?: 'false').toString().toBoolean()
def useSmokeTestNestedNoDaemon = (findProperty('inventorysort_smoke_nested_no_daemon') ?: 'true').toString().toBoolean()
def selectedSmokeProfileFilters = profileListProperty('inventorysort_smoke_profiles', '') as Set
def selectedSmokeGameVersionFilters = profileListProperty('inventorysort_smoke_game_versions', '') as Set
def selectedSmokeInstallSetFilters = profileListProperty('inventorysort_smoke_install_sets', '') as Set

def loadVersionProfile = { String profileName ->
	def profileFile = file("gradle/version-profiles/${profileName}.properties")
	if (!profileFile.isFile()) {
		throw new GradleException("Unknown Minecraft version profile '${profileName}'. Add ${profileFile}.")
	}
	def profile = new Properties()
	profileFile.withInputStream { profile.load(it) }
	return profile
}

def profileIdFor = { String profileName, Properties profile ->
	def value = profile.getProperty('profile_id')
	return value != null && !value.isBlank() ? value.trim() : profileName
}

def profileGameVersionsFor = { Properties profile ->
	def selectedVersion = profile.getProperty('minecraft_version')
	def value = profile.getProperty('modrinth_game_versions') ?: selectedVersion
	return value.toString()
			.split(',')
			.collect { it.trim() }
			.findAll { !it.isEmpty() }
}

subprojects {
	apply plugin: rootProject.loom_plugin_id
	apply plugin: 'maven-publish'

	loom {
		splitEnvironmentSourceSets()
	}

	sourceSets {
		client {
			java {
				srcDir rootProject.file("src/compat/${rootProject.compat_group}/client/java")
			}
			resources {
				srcDir rootProject.file("src/compat/${rootProject.compat_group}/client/resources")
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		if (!rootProject.unobfuscated_minecraft) {
			mappings loom.officialMojangMappings()
		}
		add(rootProject.fabric_dependency_configuration, "net.fabricmc:fabric-loader:${rootProject.loader_version}")
		add(rootProject.fabric_dependency_configuration, "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}")
	}

	processResources {
		def resourceProperties = [
				version: rootProject.mod_version,
				minecraft_version: rootProject.minecraft_version,
				loader_version: rootProject.loader_version,
				fabric_api_version: rootProject.fabric_api_version,
				java_version: rootProject.target_java_version,
				mixin_compatibility_level: "JAVA_${rootProject.target_java_version}",
				minecraft_dependency: rootProject.minecraft_dependency,
				minecraft_version_profile_id: rootProject.minecraft_version_profile_id,
				compat_group: rootProject.compat_group,
				modrinth_game_versions: rootProject.modrinth_game_versions.join(',')
		]

		inputs.properties(resourceProperties)
		filesMatching("fabric.mod.json") {
			expand(resourceProperties)
		}
		filesMatching("*.mixins.json") {
			expand(resourceProperties)
		}
		def assetIncludes = moduleAssetIncludes[project.path] ?: []
		inputs.property("inventorysort_asset_includes", assetIncludes.join(','))
		if (!assetIncludes.isEmpty()) {
			from(rootProject.file("src/main/resources/assets")) {
				into "assets"
				include assetIncludes
			}
		}
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = rootProject.target_java_version
	}

	afterEvaluate {
		tasks.matching { it.name == 'compileClientJava' }.configureEach { task ->
			if (!rootProject.excluded_shared_client_sources.isEmpty()) {
				def sharedClientRoot = rootProject.file('src/client/java').absolutePath.replace('\\', '/') + '/'
				def excludedSources = rootProject.excluded_shared_client_sources as Set
				task.setSource(task.source.filter { sourceFile ->
					def sourcePath = sourceFile.absolutePath.replace('\\', '/')
					if (!sourcePath.startsWith(sharedClientRoot)) {
						return true
					}
					def relativePath = sourcePath.substring(sharedClientRoot.length())
					return !excludedSources.contains(relativePath)
				})
			}
		}

		tasks.withType(Jar).matching { it.name.endsWith('sourcesJar') }.configureEach { task ->
			if (!rootProject.excluded_shared_client_sources.isEmpty()) {
				def sharedClientRoot = rootProject.file('src/client/java').absolutePath.replace('\\', '/') + '/'
				def excludedSources = rootProject.excluded_shared_client_sources as Set
				task.eachFile { details ->
					def sourcePath = details.file.absolutePath.replace('\\', '/')
					if (!sourcePath.startsWith(sharedClientRoot)) {
						return
					}
					def relativePath = sourcePath.substring(sharedClientRoot.length())
					if (excludedSources.contains(relativePath)) {
						details.exclude()
					}
				}
			}
		}
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(rootProject.target_java_version)
		}
		withSourcesJar()
		sourceCompatibility = JavaVersion.toVersion(rootProject.target_java_version)
		targetCompatibility = JavaVersion.toVersion(rootProject.target_java_version)
	}

	tasks.withType(JavaExec).configureEach {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(rootProject.target_java_version)
		}
	}

	jar {
		inputs.property "archivesName", project.base.archivesName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}
		from(rootProject.file("LICENSE-GPL-3.0")) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}
	}

	tasks.matching { it.name == 'runClient' }.configureEach {
		jvmArgs('-Xmx4G', '-Xms2G')
		if ((rootProject.findProperty('inventorysort_smoke_test') ?: 'false').toString().toBoolean()) {
			jvmArgs('-Dinventorysort.smokeTest=true')
			jvmArgs("-Dinventorysort.smokeMinecraftProfile=${rootProject.minecraft_version_profile}")
			def smokeReleaseProfile = rootProject.findProperty('inventorysort_smoke_release_profile')
			if (smokeReleaseProfile != null && !smokeReleaseProfile.toString().isBlank()) {
				jvmArgs("-Dinventorysort.smokeReleaseProfile=${smokeReleaseProfile}")
			}
			def smokeInstallSet = rootProject.findProperty('inventorysort_smoke_install_set')
			if (smokeInstallSet != null && !smokeInstallSet.toString().isBlank()) {
				jvmArgs("-Dinventorysort.smokeInstallSet=${smokeInstallSet}")
			}
			args('--width', '854', '--height', '480')
			def smokeRunId = smokeInstallSet != null && !smokeInstallSet.toString().isBlank() ? smokeInstallSet.toString() : 'default'
			workingDir rootProject.layout.buildDirectory.dir("smoke-run/${rootProject.minecraft_version_profile}/${project.name}/${smokeRunId}").get().asFile
		}
	}
}

tasks.register('collectReleaseJars', Copy) {
	group = 'build'
	description = 'Collects publish-ready public feature jars into build/release.'
	dependsOn publicFeatureProjects.collect { it.tasks.named(release_jar_task_name) }

	from(publicFeatureProjects.collect { featureProject ->
		featureProject.tasks.named(release_jar_task_name).flatMap { it.archiveFile }
	})
	into releaseOutputDirectory

	doFirst {
		delete releaseOutputDirectory
	}
}

tasks.register('verifyReleaseJars') {
	group = 'verification'
	description = 'Verifies public release jars embed the Core jar and expected metadata/assets.'
	dependsOn tasks.named('collectReleaseJars')

	doLast {
		String expectedCoreJar = "META-INF/jars/inventory-sort-core-${version}.jar"
		String forbiddenDevCoreJar = "META-INF/jars/inventory-sort-core-${version}-dev.jar"
		String expectedMinecraftDependency = rootProject.minecraft_dependency
		String expectedJavaDependency = ">=${rootProject.target_java_version}"

		publicFeatureProjects.each { featureProject ->
			def releaseJar = layout.buildDirectory.file("release/${minecraft_version_profile_id}/${featureProject.base.archivesName.get()}-${version}.jar").get().asFile
			if (!releaseJar.isFile()) {
				throw new GradleException("Missing release jar: ${releaseJar}")
			}
			if (releaseJar.length() > maxPublicReleaseJarSizeBytes) {
				throw new GradleException("${releaseJar.name} is ${releaseJar.length()} bytes, exceeding max ${maxPublicReleaseJarSizeBytes} bytes")
			}

			def entries = [] as Set
			def embeddedCoreEntries = [] as Set
			def fabricMetadata = null
			new java.util.zip.ZipFile(releaseJar).withCloseable { zip ->
				def entryEnumeration = zip.entries()
				while (entryEnumeration.hasMoreElements()) {
					entries.add(entryEnumeration.nextElement().name)
				}

				def modJsonEntry = zip.getEntry('fabric.mod.json')
				if (modJsonEntry == null) {
					throw new GradleException("${releaseJar.name} is missing fabric.mod.json")
				}
				zip.getInputStream(modJsonEntry).withCloseable { stream ->
					fabricMetadata = new groovy.json.JsonSlurper().parse(stream)
				}

				def embeddedCoreEntry = zip.getEntry(expectedCoreJar)
				if (embeddedCoreEntry != null) {
					zip.getInputStream(embeddedCoreEntry).withCloseable { stream ->
						new java.util.zip.ZipInputStream(stream).withCloseable { nestedZip ->
							def nestedEntry
							while ((nestedEntry = nestedZip.nextEntry) != null) {
								embeddedCoreEntries.add(nestedEntry.name)
							}
						}
					}
				}
			}

			if (entries.contains(forbiddenDevCoreJar)) {
				throw new GradleException("${releaseJar.name} embeds development Core jar ${forbiddenDevCoreJar}")
			}
			if (!entries.contains(expectedCoreJar)) {
				throw new GradleException("${releaseJar.name} does not embed Core jar ${expectedCoreJar}")
			}
			def junkEntries = packagedJunkEntries(entries)
			if (!junkEntries.isEmpty()) {
				throw new GradleException("${releaseJar.name} packages non-runtime project files: ${junkEntries.join(', ')}")
			}
			def embeddedCoreJunkEntries = packagedJunkEntries(embeddedCoreEntries)
			if (!embeddedCoreJunkEntries.isEmpty()) {
				throw new GradleException("${releaseJar.name}!/${expectedCoreJar} packages non-runtime project files: ${embeddedCoreJunkEntries.join(', ')}")
			}
			if (fabricMetadata.depends.minecraft != expectedMinecraftDependency) {
				throw new GradleException("${releaseJar.name} declares Minecraft dependency ${fabricMetadata.depends.minecraft}, expected ${expectedMinecraftDependency}")
			}
			if (fabricMetadata.depends.java != expectedJavaDependency) {
				throw new GradleException("${releaseJar.name} declares Java dependency ${fabricMetadata.depends.java}, expected ${expectedJavaDependency}")
			}
			if (!fabricMetadata.icon || !entries.contains(fabricMetadata.icon.toString())) {
				throw new GradleException("${releaseJar.name} declares missing icon ${fabricMetadata.icon}")
			}
			def allowedAssets = (moduleAssetIncludes[featureProject.path] ?: [])
					.collect { "assets/${it}" } as Set
			def packagedAssets = entries.findAll {
				it.startsWith('assets/inventory-sort/') && !it.endsWith('/')
			} as Set
			if (packagedAssets != allowedAssets) {
				throw new GradleException("${releaseJar.name} packages assets ${packagedAssets}, expected ${allowedAssets}")
			}
		}
	}
}

tasks.register('verifySmokeTestMatrix') {
	group = 'verification'
	description = 'Verifies supported profiles have passing smoke-test records and candidate profiles are tracked.'

	doLast {
		def smokeFile = file('gradle/smoke-tests.json')
		if (!smokeFile.isFile()) {
			throw new GradleException("Missing smoke-test matrix: ${smokeFile}")
		}

		def smokeMatrix = new groovy.json.JsonSlurper().parse(smokeFile)
		def profilesNode = smokeMatrix.profiles ?: [:]
		def validStatuses = ['pass', 'pending', 'fail'] as Set

		smokeTestRequiredMinecraftVersionProfiles.each { profileName ->
			def profile = loadVersionProfile(profileName)
			def profileId = profileIdFor(profileName, profile)
			def smokeProfile = profilesNode[profileId]
			if (!smokeProfile) {
				throw new GradleException("Smoke-test matrix is missing required profile '${profileId}'.")
			}

			profileGameVersionsFor(profile).each { gameVersion ->
				def result = smokeProfile.game_versions ? smokeProfile.game_versions[gameVersion] : null
				if (!result) {
					throw new GradleException("Smoke-test matrix is missing required ${profileId} / ${gameVersion}.")
				}
				if (!validStatuses.contains(result.status)) {
					throw new GradleException("Smoke-test matrix has invalid status '${result.status}' for ${profileId} / ${gameVersion}.")
				}
				if (result.status != 'pass') {
					throw new GradleException("Supported profile '${profileId}' cannot publish ${gameVersion}; smoke status is '${result.status}'.")
				}
				if (!result.tested_at || !result.method) {
					throw new GradleException("Passing smoke record for ${profileId} / ${gameVersion} must include tested_at and method.")
				}
			}
		}

		candidateMinecraftVersionProfiles.each { profileName ->
			def profile = loadVersionProfile(profileName)
			def profileId = profileIdFor(profileName, profile)
			def smokeProfile = profilesNode[profileId]
			if (!smokeProfile) {
				throw new GradleException("Smoke-test matrix is missing candidate profile '${profileId}'. Add pending records before CI validation.")
			}

			profileGameVersionsFor(profile).each { gameVersion ->
				def result = smokeProfile.game_versions ? smokeProfile.game_versions[gameVersion] : null
				if (!result) {
					throw new GradleException("Smoke-test matrix is missing candidate ${profileId} / ${gameVersion}. Add a pending/pass/fail record.")
				}
				if (!validStatuses.contains(result.status)) {
					throw new GradleException("Smoke-test matrix has invalid status '${result.status}' for ${profileId} / ${gameVersion}.")
				}
				if (result.status == 'pass' && (!result.tested_at || !result.method)) {
					throw new GradleException("Passing smoke record for ${profileId} / ${gameVersion} must include tested_at and method.")
				}
				if (result.status != 'pass') {
					println "Candidate profile '${profileId}' for Minecraft ${gameVersion} is tracked as '${result.status}' and remains non-publishable."
				}
			}
		}
	}
}

