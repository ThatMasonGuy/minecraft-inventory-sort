import org.gradle.api.tasks.GradleBuild

plugins {
	id 'base'
	id 'net.fabricmc.fabric-loom-remap' apply false
}

def versionProfileName = providers.gradleProperty('minecraft_version_profile')
		.orElse(providers.gradleProperty('target_minecraft_version'))
		.orElse('1.21.11')
		.get()
def versionProfileFile = file("gradle/version-profiles/${versionProfileName}.properties")
if (!versionProfileFile.isFile()) {
	throw new GradleException("Unknown Minecraft version profile '${versionProfileName}'. Add ${versionProfileFile}.")
}
def versionProfile = new Properties()
versionProfileFile.withInputStream { versionProfile.load(it) }

[
		'minecraft_version',
		'loader_version',
		'loom_version',
		'fabric_api_version',
		'java_version'
].each { key ->
	if (!versionProfile.getProperty(key)) {
		throw new GradleException("Minecraft version profile '${versionProfileName}' is missing ${key}.")
	}
}

def profileProperty = { String key, String defaultValue ->
	def value = versionProfile.getProperty(key)
	return value != null && !value.isBlank() ? value.trim() : defaultValue
}
def selectedMinecraftVersion = versionProfile.getProperty('minecraft_version')

ext.minecraft_version_profile = versionProfileName
ext.minecraft_version_profile_id = profileProperty('profile_id', versionProfileName)
ext.minecraft_version = selectedMinecraftVersion
ext.loader_version = versionProfile.getProperty('loader_version')
ext.loom_version = versionProfile.getProperty('loom_version')
ext.fabric_api_version = versionProfile.getProperty('fabric_api_version')
ext.target_java_version = versionProfile.getProperty('java_version') as int
ext.minecraft_dependency = profileProperty('minecraft_dependency', "~${selectedMinecraftVersion}")
ext.compat_group = profileProperty('compat_group', minecraft_version_profile_id)
ext.modrinth_game_versions = profileProperty('modrinth_game_versions', selectedMinecraftVersion)
		.split(',')
		.collect { it.trim() }
		.findAll { !it.isEmpty() }

allprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		// Loom adds essential repositories automatically
	}
}

def publicFeatureProjects = [
		project(':inventorysort'),
		project(':inventorysearch'),
		project(':inventorycatalogue')
]
def releaseOutputDirectory = layout.buildDirectory.dir("release/${minecraft_version_profile_id}")
def supportedMinecraftVersionProfiles = (findProperty('supported_minecraft_version_profiles') ?: minecraft_version_profile)
		.toString()
		.split(',')
		.collect { it.trim() }
		.findAll { !it.isEmpty() }

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
	apply plugin: 'maven-publish'

	loom {
		splitEnvironmentSourceSets()
	}

	sourceSets {
		client {
			java {
				srcDir rootProject.file("src/compat/${rootProject.compat_group}/client/java")
			}
			resources {
				srcDir rootProject.file("src/compat/${rootProject.compat_group}/client/resources")
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def resourceProperties = [
				version: rootProject.mod_version,
				minecraft_version: rootProject.minecraft_version,
				loader_version: rootProject.loader_version,
				fabric_api_version: rootProject.fabric_api_version,
				java_version: rootProject.target_java_version,
				minecraft_dependency: rootProject.minecraft_dependency,
				minecraft_version_profile_id: rootProject.minecraft_version_profile_id,
				compat_group: rootProject.compat_group,
				modrinth_game_versions: rootProject.modrinth_game_versions.join(',')
		]

		inputs.properties(resourceProperties)
		filesMatching("fabric.mod.json") {
			expand(resourceProperties)
		}
		from(rootProject.file("src/main/resources/assets")) {
			into "assets"
		}
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = rootProject.target_java_version
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.toVersion(rootProject.target_java_version)
		targetCompatibility = JavaVersion.toVersion(rootProject.target_java_version)
	}

	jar {
		inputs.property "archivesName", project.base.archivesName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}
		from(rootProject.file("LICENSE-GPL-3.0")) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}
	}

	tasks.matching { it.name == 'runClient' }.configureEach {
		jvmArgs('-Xmx4G', '-Xms2G')
	}
}

tasks.register('collectReleaseJars', Copy) {
	group = 'build'
	description = 'Collects publish-ready public feature jars into build/release.'
	dependsOn publicFeatureProjects.collect { it.tasks.named('remapJar') }

	from(publicFeatureProjects.collect { featureProject ->
		featureProject.tasks.named('remapJar').flatMap { it.archiveFile }
	})
	into releaseOutputDirectory

	doFirst {
		delete releaseOutputDirectory
	}
}

tasks.register('verifyReleaseJars') {
	group = 'verification'
	description = 'Verifies public release jars embed the remapped Core jar.'
	dependsOn tasks.named('collectReleaseJars')

	doLast {
		String expectedCoreJar = "META-INF/jars/inventory-sort-core-${version}.jar"
		String forbiddenDevCoreJar = "META-INF/jars/inventory-sort-core-${version}-dev.jar"
		String expectedMinecraftDependency = rootProject.minecraft_dependency
		String expectedJavaDependency = ">=${rootProject.target_java_version}"

		publicFeatureProjects.each { featureProject ->
			def releaseJar = layout.buildDirectory.file("release/${minecraft_version_profile_id}/${featureProject.base.archivesName.get()}-${version}.jar").get().asFile
			if (!releaseJar.isFile()) {
				throw new GradleException("Missing release jar: ${releaseJar}")
			}

			def entries = [] as Set
			def fabricMetadata = null
			new java.util.zip.ZipFile(releaseJar).withCloseable { zip ->
				def entryEnumeration = zip.entries()
				while (entryEnumeration.hasMoreElements()) {
					entries.add(entryEnumeration.nextElement().name)
				}

				def modJsonEntry = zip.getEntry('fabric.mod.json')
				if (modJsonEntry == null) {
					throw new GradleException("${releaseJar.name} is missing fabric.mod.json")
				}
				zip.getInputStream(modJsonEntry).withCloseable { stream ->
					fabricMetadata = new groovy.json.JsonSlurper().parse(stream)
				}
			}

			if (entries.contains(forbiddenDevCoreJar)) {
				throw new GradleException("${releaseJar.name} embeds development Core jar ${forbiddenDevCoreJar}")
			}
			if (!entries.contains(expectedCoreJar)) {
				throw new GradleException("${releaseJar.name} does not embed remapped Core jar ${expectedCoreJar}")
			}
			if (fabricMetadata.depends.minecraft != expectedMinecraftDependency) {
				throw new GradleException("${releaseJar.name} declares Minecraft dependency ${fabricMetadata.depends.minecraft}, expected ${expectedMinecraftDependency}")
			}
			if (fabricMetadata.depends.java != expectedJavaDependency) {
				throw new GradleException("${releaseJar.name} declares Java dependency ${fabricMetadata.depends.java}, expected ${expectedJavaDependency}")
			}
		}
	}
}

tasks.register('printVersionProfile') {
	group = 'help'
	description = 'Prints the active Minecraft/Fabric build profile.'

	doLast {
		println "Minecraft version profile: ${minecraft_version_profile}"
		println "Profile id: ${minecraft_version_profile_id}"
		println "Minecraft: ${minecraft_version}"
		println "Minecraft dependency: ${minecraft_dependency}"
		println "Modrinth game versions: ${modrinth_game_versions.join(', ')}"
		println "Fabric Loader: ${loader_version}"
		println "Fabric API: ${fabric_api_version}"
		println "Loom: ${loom_version}"
		println "Java release: ${target_java_version}"
		println "Compat group: ${compat_group}"
		println "Release output: ${releaseOutputDirectory.get().asFile}"
	}
}

tasks.register('buildAllMods') {
	group = 'build'
	description = 'Builds all mod jars and collects public feature jars into build/release.'
	dependsOn ':inventorysort-core:build', ':inventorysort:build', ':inventorysearch:build', ':inventorycatalogue:build'
	dependsOn tasks.named('collectReleaseJars')
	dependsOn tasks.named('verifyReleaseJars')
}

def versionBuildTasks = supportedMinecraftVersionProfiles.collect { profile ->
	def taskName = "buildMinecraft${profile.replaceAll(/[^A-Za-z0-9]/, '_')}"
	tasks.register(taskName, GradleBuild) {
		group = 'build'
		description = "Builds all mod jars for Minecraft version profile ${profile}."
		tasks = ['buildAllMods']
		startParameter.projectProperties = new LinkedHashMap<>(gradle.startParameter.projectProperties)
		startParameter.projectProperties.put('minecraft_version_profile', profile)
	}
}

tasks.register('buildAllVersions') {
	group = 'build'
	description = 'Builds every supported Minecraft version profile.'
	dependsOn versionBuildTasks
}

tasks.named('build') {
	dependsOn tasks.named('buildAllMods')
}

tasks.named('check') {
	dependsOn tasks.named('verifyReleaseJars')
}
