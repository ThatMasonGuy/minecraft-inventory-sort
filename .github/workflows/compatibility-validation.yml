name: compatibility validation

on:
  workflow_dispatch:
    inputs:
      minecraft_version_profile:
        description: 'Minecraft version profile to validate'
        required: true
        type: string
        default: '26.x'
      validation_task:
        description: 'Gradle task to run for the selected profile'
        required: true
        type: choice
        default: buildAllMods
        options:
          - printVersionProfile
          - buildAllMods
          - smokeTestSelectedClients
          - smokeTestInventorySearchServer
      smoke_profiles:
        description: 'Comma-separated smoke release profile/profile_id filters for smokeTestSelectedClients'
        required: false
        type: string
        default: '26.1-26.2-pre-3'
      smoke_game_versions:
        description: 'Comma-separated exact Minecraft game versions for smokeTestSelectedClients'
        required: false
        type: string
        default: ''
      smoke_install_sets:
        description: 'Comma-separated install sets for smokeTestSelectedClients'
        required: false
        type: string
        default: 'all-public'
      gradle_java_version:
        description: 'Java version used to run Gradle'
        required: true
        type: choice
        default: '25'
        options:
          - '25'
          - '21'
          - '17'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 21 toolchain
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup jdk 17 toolchain
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: setup jdk 25 toolchain
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: select gradle jdk 17
        if: ${{ inputs.gradle_java_version == '17' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: select gradle jdk 21
        if: ${{ inputs.gradle_java_version == '21' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: select gradle jdk 25
        if: ${{ inputs.gradle_java_version == '25' }}
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: print java runtime
        run: java -version
      - name: print selected profile
        run: >
          ./gradlew printVersionProfile
          -Pminecraft_version_profile=${{ inputs.minecraft_version_profile }}
          --no-daemon
          --console=plain
      - name: validate selected profile
        if: ${{ inputs.validation_task != 'smokeTestSelectedClients' }}
        run: >
          ./gradlew ${{ inputs.validation_task }}
          -Pminecraft_version_profile=${{ inputs.minecraft_version_profile }}
          --no-daemon
          --console=plain
      - name: install virtual display
        if: ${{ inputs.validation_task == 'smokeTestSelectedClients' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb flite1-dev
      - name: smoke selected profile
        if: ${{ inputs.validation_task == 'smokeTestSelectedClients' }}
        run: >
          ./gradlew smokeTestSelectedClients
          -Pminecraft_version_profile=${{ inputs.minecraft_version_profile }}
          -Pinventorysort_smoke_profiles=${{ inputs.smoke_profiles }}
          -Pinventorysort_smoke_game_versions=${{ inputs.smoke_game_versions }}
          -Pinventorysort_smoke_install_sets=${{ inputs.smoke_install_sets }}
          -Pinventorysort_smoke_xvfb=true
          --no-daemon
          --console=plain
      - name: capture validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility Validation
          path: |
            build/release/
            build/reports/
            modules/*/build/reports/
